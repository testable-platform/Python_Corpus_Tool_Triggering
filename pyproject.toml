# orderlab -- branch PY-070
# Build backend : poetry-core 1.9.1
# Package manager: uv 0.12.9
# Interpreter    : CPython 3.8.18
#
# poetry-core 1.9.1 -- the newest release admitting Python 3.8. Still predates poetry-core 2, so metadata lives in [tool.poetry] and poetry-core does not write a PEP 621 [project] table. uv needs a PEP 621 [project] table to read the project and poetry-core 1.x does not write one, so pyproject.toml also carries a mirrored [project] table; [tool.poetry] stays authoritative for the build and full_check.py asserts the two agree.
# uv 0.12.9 runs here -- 3.8 is exactly its floor, and this is the CURRENT LATEST uv, not a rolled-back one. Verified in-session: `uv venv --python 3.8` succeeds, `uv pip install` resolves, `uv lock` produces a lockfile, and `uv python install 3.8` installs a managed CPython 3.8.20. After two families in which this axis was entirely dark, it is live. uv requires a PEP 621 [project] table; the mirrored one in pyproject.toml supplies it, so uv drives this poetry-core branch.

[build-system]
requires = ["poetry-core==1.9.1"]
build-backend = "poetry.core.masonry.api"

# --- uv's view of the project -------------------------------------------
# uv reads PEP 621 [project] and [dependency-groups]; it does not read
# [tool.poetry]. This table mirrors that metadata one-to-one so that
# `uv lock` and `uv sync` can see the project. [tool.poetry] stays the authority
# for the build, and full_check.py asserts that the two agree on name,
# version, requires-python and runtime pins.
[project]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
readme = "README.md"
requires-python = "==3.8.18"
license = { text = "MIT" }
authors = [{ name = "Prajith Kumaravel", email = "prajith.k19022003@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests==2.31.0",
    "Jinja2==3.1.3",
    "urllib3==2.0.6",
    "cryptography==42.0.0",
    "paramiko==2.4.1",
    "six==1.17.0"
]

[project.scripts]
orderlab = "orderlab.__main__:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "crosshair-tool==0.0.110 ; python_version >= '3.8'",
    "coverage==7.16.0 ; python_version >= '3.10'",
    "pymcdc==0.2.6 ; python_version >= '3.10'",
    "radon==6.0.1",
    "lizard==1.24.0",
    "pytest-testmon==2.2.0 ; python_version >= '3.10'",
    "pylint==4.0.8 ; python_version >= '3.10'",
    "semgrep==1.176.0 ; python_version >= '3.10'",
    "bandit==1.9.4 ; python_version >= '3.10'",
    "pip-audit==2.10.1 ; python_version >= '3.10'",
    "cosmic-ray==8.7.0 ; python_version >= '3.9'",
    "beniget==0.5.0 ; python_version >= '3.6'",
    "gast==0.7.0 ; python_version >= '3.6'",
    "pydriller==2.10 ; python_version >= '3.5'",
    "ruff==0.16.5 ; python_version >= '3.7'",
    "complexipy==7.0.1 ; python_version >= '3.8'",
    "slipcover==1.1.0 ; python_version >= '3.9'",
    "mutmut==3.7.0 ; python_version >= '3.10'",
    "diff-cover==10.5.1 ; python_version >= '3.10'",
    "astroid==4.3.1 ; python_version >= '3.10'",
    "pyan3==2.8.1 ; python_version >= '3.10'",
    "vulture==2.16 ; python_version >= '3.9'",
    "dulwich==1.2.14 ; python_version >= '3.10'",
]

# poetry-core 1.9.1 predates poetry-core 2, so metadata lives in
# [tool.poetry] rather than PEP 621 [project]; the [project] table above
# is a mirror for uv's benefit.
[tool.poetry]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
authors = ["Prajith Kumaravel <prajith.k19022003@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "orderlab", from = "packages/domain/src" }]

[tool.poetry.dependencies]
python = "==3.8.18"
requests = "2.31.0"
Jinja2 = "3.1.3"
urllib3 = "2.0.6"
cryptography = "42.0.0"
paramiko = "2.4.1"
six = "1.17.0"

[tool.poetry.dev-dependencies]
pytest = "8.3.5"
crosshair-tool = { version = "0.0.110", python = ">=3.8" }
coverage = { version = "7.16.0", python = ">=3.10" }
pymcdc = { version = "0.2.6", python = ">=3.10" }
radon = "6.0.1"
lizard = "1.24.0"
pytest-testmon = { version = "2.2.0", python = ">=3.10" }
pylint = { version = "4.0.8", python = ">=3.10" }
semgrep = { version = "1.176.0", python = ">=3.10" }
bandit = { version = "1.9.4", python = ">=3.10" }
pip-audit = { version = "2.10.1", python = ">=3.10" }
cosmic-ray = { version = "8.7.0", python = ">=3.9" }
beniget = { version = "0.5.0", python = ">=3.6" }
gast = { version = "0.7.0", python = ">=3.6" }
pydriller = { version = "2.10", python = ">=3.5" }
ruff = { version = "0.16.5", python = ">=3.7" }
complexipy = { version = "7.0.1", python = ">=3.8" }
slipcover = { version = "1.1.0", python = ">=3.9" }
mutmut = { version = "3.7.0", python = ">=3.10" }
diff-cover = { version = "10.5.1", python = ">=3.10" }
astroid = { version = "4.3.1", python = ">=3.10" }
pyan3 = { version = "2.8.1", python = ">=3.10" }
vulture = { version = "2.16", python = ">=3.9" }
dulwich = { version = "1.2.14", python = ">=3.10" }

[tool.poetry.scripts]
orderlab = "orderlab.__main__:main"
