# orderlab -- branch PY-060
# Build backend : uv_build 0.12.9
# Package manager: poetry 1.8.5
# Interpreter    : CPython 3.8.18
#
# uv_build 0.12.9 -- MANDATES PEP 621 [project] and requires Python >=3.8. 3.8 is exactly that floor, so this is the first family in which the backend actually executes -- and it does so at the current latest release, not a rolled-back one.
# poetry 1.8.5 -- the newest release admitting Python 3.8. Uses the pre-PEP-621 [tool.poetry] table. poetry 1.8.5 predates poetry 2's PEP 621 support, so it reads dependencies and the package location from [tool.poetry]; pyproject.toml carries a mirrored [tool.poetry] table next to the [project] table that uv_build requires.

[build-system]
requires = ["uv_build>=0.12.9"]
build-backend = "uv_build"

# uv_build MANDATES PEP 621, so unlike the other two backends this
# branch must carry a [project] table. It also requires Python >=3.8,
# and 3.8 is exactly that floor -- so unlike the two earlier families
# this backend actually builds. See TRAPS-PY38.md.
[project]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
readme = "README.md"
requires-python = "==3.8.18"
license = { text = "MIT" }
authors = [{ name = "Prajith Kumaravel", email = "prajith.k19022003@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests==2.31.0",
    "Jinja2==3.1.3",
    "urllib3==2.0.6",
    "cryptography==42.0.0",
    "paramiko==2.4.1",
    "six==1.17.0"
]

[project.scripts]
orderlab = "orderlab.__main__:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "crosshair-tool==0.0.110 ; python_version >= '3.8'",
    "coverage==7.16.0 ; python_version >= '3.10'",
    "pymcdc==0.2.6 ; python_version >= '3.10'",
    "radon==6.0.1",
    "lizard==1.24.0",
    "pytest-testmon==2.2.0 ; python_version >= '3.10'",
    "pylint==4.0.8 ; python_version >= '3.10'",
    "semgrep==1.176.0 ; python_version >= '3.10'",
    "bandit==1.9.4 ; python_version >= '3.10'",
    "pip-audit==2.10.1 ; python_version >= '3.10'",
    "cosmic-ray==8.7.0 ; python_version >= '3.9'",
    "beniget==0.5.0 ; python_version >= '3.6'",
    "gast==0.7.0 ; python_version >= '3.6'",
    "pydriller==2.10 ; python_version >= '3.5'",
    "ruff==0.16.5 ; python_version >= '3.7'",
    "complexipy==7.0.1 ; python_version >= '3.8'",
    "slipcover==1.1.0 ; python_version >= '3.9'",
    "mutmut==3.7.0 ; python_version >= '3.10'",
    "diff-cover==10.5.1 ; python_version >= '3.10'",
    "astroid==4.3.1 ; python_version >= '3.10'",
    "pyan3==2.8.1 ; python_version >= '3.10'",
    "vulture==2.16 ; python_version >= '3.9'",
    "dulwich==1.2.14 ; python_version >= '3.10'",
]

[tool.uv.build-backend]
module-name = "orderlab"
module-root = "packages/domain/src"

# --- poetry's view of the project ---------------------------------------
# poetry 1.8.5 predates poetry 2's PEP 621 support and reads dependencies
# and the package location from [tool.poetry]. This table mirrors the
# [project] table above one-to-one; [project] stays the authority for
# uv_build, and full_check.py asserts that the two agree.
[tool.poetry]
name = "orderlab"
version = "1.0.0"
description = "Order pricing domain used as a white-box tool-evaluation fixture"
authors = ["Prajith Kumaravel <prajith.k19022003@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "orderlab", from = "packages/domain/src" }]

[tool.poetry.dependencies]
python = "==3.8.18"
requests = "2.31.0"
Jinja2 = "3.1.3"
urllib3 = "2.0.6"
cryptography = "42.0.0"
paramiko = "2.4.1"
six = "1.17.0"

[tool.poetry.dev-dependencies]
pytest = "8.3.5"
crosshair-tool = { version = "0.0.110", python = ">=3.8" }
coverage = { version = "7.16.0", python = ">=3.10" }
pymcdc = { version = "0.2.6", python = ">=3.10" }
radon = "6.0.1"
lizard = "1.24.0"
pytest-testmon = { version = "2.2.0", python = ">=3.10" }
pylint = { version = "4.0.8", python = ">=3.10" }
semgrep = { version = "1.176.0", python = ">=3.10" }
bandit = { version = "1.9.4", python = ">=3.10" }
pip-audit = { version = "2.10.1", python = ">=3.10" }
cosmic-ray = { version = "8.7.0", python = ">=3.9" }
beniget = { version = "0.5.0", python = ">=3.6" }
gast = { version = "0.7.0", python = ">=3.6" }
pydriller = { version = "2.10", python = ">=3.5" }
ruff = { version = "0.16.5", python = ">=3.7" }
complexipy = { version = "7.0.1", python = ">=3.8" }
slipcover = { version = "1.1.0", python = ">=3.9" }
mutmut = { version = "3.7.0", python = ">=3.10" }
diff-cover = { version = "10.5.1", python = ">=3.10" }
astroid = { version = "4.3.1", python = ">=3.10" }
pyan3 = { version = "2.8.1", python = ">=3.10" }
vulture = { version = "2.16", python = ">=3.9" }
dulwich = { version = "1.2.14", python = ">=3.10" }

[tool.poetry.scripts]
orderlab = "orderlab.__main__:main"
